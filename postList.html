<!DOCTYPE html>
<html lang="ko">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>여행지 탐색 — 어디갈까?</title>
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link href="https://fonts.googleapis.com/css2?family=Noto+Sans+KR:wght@400;500;600;700;800&display=swap" rel="stylesheet">
  <link rel="stylesheet" href="css/postListstyle.css">
</head>
<body>

  <!-- ── Header ── -->
  <header class="header">
    <div class="container header-inner">
      <a href="postList.html" class="logo">
        <div class="logo-icon">✈️</div>
        <div class="logo-text">
          <span class="logo-name">어디갈까?</span>
          <span class="logo-sub">국내여행 랜덤 추천 서비스</span>
        </div>
      </a>
      <nav class="nav">
        <a href="#" class="nav-link">🏠 여행 지도</a>
        <a href="postList.html" class="nav-link active">🧭 여행 추천</a>
        <a href="#" class="nav-link">👤 여행 수첩</a>
        <a href="#" class="nav-link">👤 마이페이지</a>
      </nav>
      <div class="header-actions">
        <button class="bookmark-btn" title="북마크">🔖</button>
        <button class="login-btn">로그인</button>
      </div>
    </div>
  </header>

  <!-- ── City filter (sticky) ── -->
  <div class="filter-bar">
    <div class="container">
      <div class="city-pills" id="city-filter"></div>
    </div>
  </div>

  <!-- ── Main content ── -->
  <main class="main">
    <div class="container">

      <!-- Tab switcher -->
      <div class="tabs">
        <button class="tab-btn active" data-tab="travel">🗺️ 여행지</button>
        <button class="tab-btn"        data-tab="festival">🎉 축제</button>
      </div>

      <!-- Dynamic posts area -->
      <div id="posts-container"></div>

    </div>
  </main>

  <script src="js/config.js"></script>
  <script src="js/api.js"></script>
  <script src="js/postList.js"></script>
</body>
</html>
