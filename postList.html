<!DOCTYPE html>
<html lang="ko">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>여행지 탐색 — 어디갈까?</title>
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link href="https://fonts.googleapis.com/css2?family=Noto+Sans+KR:wght@400;500;600;700;800&display=swap" rel="stylesheet">
  <link rel="stylesheet" href="css/poststyle.css">
  <link rel="stylesheet" href="css/style.css">  
  <link rel="stylesheet" href="css/style_mp.css">
  <link rel="stylesheet" href="css/reset.css">

</head>
<body>

  <!--</header> -->
  <div id="app-topnav"></div>
  
  <!-- ── City filter (sticky) ── -->
  <div class="filter-bar">
    <div class="container">
      <div class="city-pills" id="city-filter"></div>
      <div class="sigungu-pills" id="sigungu-filter"></div>
    </div>
  </div>

  <!-- ── Main content ── -->
  <main class="main">
    <div class="container">

      <!-- Tab switcher -->
      <div class="tabs">
        <button class="tab-btn active" data-tab="travel">🗺️ 여행지</button>
        <button class="tab-btn"        data-tab="festival">🎉 축제</button>
      </div>

      <!-- Dynamic posts area -->
      <div id="posts-container"></div>

    </div>
  </main>

  <script src="js/config.js"></script>
  <script src="js/api.js"></script>
  <script src="js/postList.js"></script>
  <script src="js/topnav.js"></script>
</body>
</html>
