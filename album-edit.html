<!DOCTYPE html>
<html lang="ko">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>어디갈까? | 앨범 만들기 / 수정</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link href="https://fonts.googleapis.com/css2?family=Noto+Sans+KR:wght@400;500;700;900&family=Inter:wght@600;700;800&display=swap" rel="stylesheet">
<link rel="stylesheet" href="./css/reset.css" />
<link rel="stylesheet" href="./css/style_mp.css">
<link rel="stylesheet" href="./css/style.css" />
<link rel="stylesheet" href="./css/album-edit.css">
</head>
<!-- 이 페이지는 URL에 ?id=앨범아이디 가 있으면 "수정 모드",
     없으면 "새 앨범 만들기 모드" 로 동작합니다. (app.js 에서 판별) -->
<body data-page="album-edit">

<div id="page-app" class="page app-page">

  <div id="app-topnav"></div>

  <div class="app-body">
    <div id="app-sidebar"></div>

    <main class="content">
      <button class="back-link" id="back-to-list-btn">← 뒤로가기</button>

      <h2 class="view-title" id="edit-page-title">새 앨범 만들기</h2>

      <input class="title-input" id="edit-title" placeholder="여행 제목을 입력하세요 (예: 강릉 바다 여행)">

      <div class="field-box">
        <svg width="16" height="16" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"><rect x="3" y="5" width="18" height="16" rx="2"/><path d="M8 3v4M16 3v4M3 10h18"/></svg>
        <input type="date" id="edit-date-start" class="date-input">
        <span class="tilde">~</span>
        <input type="date" id="edit-date-end" class="date-input">
      </div>

      <div class="field-box">
        <svg width="16" height="16" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"><path d="M12 21s-7-7.2-7-12a7 7 0 1 1 14 0c0 4.8-7 12-7 12z"/><circle cx="12" cy="9" r="2.4"/></svg>
        <input type="text" id="edit-location" class="plain-input" placeholder="여행지를 입력하세요">
      </div>

      <!-- 앨범 카드 색상 선택 -->
      <div class="form-section-title">앨범 색상</div>
      <div class="color-field">
        <div class="color-popover" id="edit-color-swatches" style="position:static; box-shadow:none; padding:0; width:auto;"></div>
      </div>

      <!-- 수정 모드일 때만 보임: 이미 등록된 사진+일기 기록들 (수정 · 삭제 가능) -->
      <div id="existing-entries-block" hidden>
        <div class="form-section-title">등록된 기록</div>
        <div class="existing-entries" id="existing-entries"></div>
      </div>

      <hr class="edit-divider">

      <div class="form-section-title">새 기록 추가</div>
      <div class="entry-form-grid">
        <label class="dropzone" id="edit-photo-drop">
          <input type="file" id="edit-photo-input" accept="image/*" hidden>
          <span class="dz-content" id="edit-photo-content">
            <span class="dz-plus">+</span>
            <span>사진을 올려주세요</span>
          </span>
        </label>

        <div class="diary-box">
          <span class="diary-label">
            <svg width="14" height="14" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"><path d="M12 20h9M16.5 3.5a2.1 2.1 0 0 1 3 3L7 19l-4 1 1-4Z"/></svg>
            여행 일기
          </span>
          <textarea id="edit-diary" placeholder="여행 감상을 남겨주세요."></textarea>
        </div>
      </div>

      <button class="add-content-btn" id="edit-add-content-btn">내용 추가하기</button>

      <button class="save-btn" id="edit-save-btn">저장하기</button>

      <!-- 수정 모드일 때만 보임: 앨범 전체 삭제 -->
      <button class="danger-btn" id="edit-delete-album-btn" hidden>이 앨범 전체 삭제하기</button>
    </main>
  </div>
</div>

<div id="toast" class="toast"></div>
<script src="./js/config.js"></script>
<script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script>
<script src="./js/supabaseClient.js"></script>
<script src="./js/authState.js"></script>
<script src="./js/app.js"></script>
<script src="./js/topnav.js"></script>
<script src="./js/sidebar.js"></script>
<script src="./js/bookmark.js"></script>
<script src="./js/album.js"></script>
</body>
</html>
