<!DOCTYPE html>
<html lang="ko">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>어디갈까? | 회원가입</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link href="https://fonts.googleapis.com/css2?family=Noto+Sans+KR:wght@400;500;700;900&family=Inter:wght@600;700;800&display=swap" rel="stylesheet">
<link rel="stylesheet" href="./css/style_mp.css">
<link rel="stylesheet" href="./css/login.css">
<link rel="icon" href="images/favicon.ico" />
</head>
<!-- data-page 속성으로 app.js 가 "지금 회원가입 페이지구나"를 판별합니다 -->
<body data-page="register">

<div id="page-login" class="page login-page">
  <div class="login-card">
    <h1 class="login-title">회원가입</h1>
    <p class="login-sub">여행 다이어리를 시작하기 위한 계정을 만들어주세요.</p>

    <form id="register-form">
      <label class="field-label" for="register-name">닉네임</label>
      <input class="text-input" type="text" id="register-name" placeholder="닉네임 입력" required>

      <label class="field-label" for="register-email">이메일</label>
      <input class="text-input" type="email" id="register-email" placeholder="이메일 입력" required>

      <label class="field-label" for="register-password">비밀번호</label>
      <input class="text-input" type="password" id="register-password" placeholder="비밀번호 입력 (4자 이상)" required minlength="4">

      <button type="submit" class="btn-gradient login-btn">회원가입</button>
    </form>
    <p class="login-hint">이미 계정이 있으신가요? <a href="login.html">로그인하기</a></p>
  </div>
</div>

<div id="toast" class="toast"></div>
<script src="./js/config.js"></script>
<script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script>
<script src="./js/supabaseClient.js"></script>
<script src="./js/authState.js"></script>
<script src="./js/app.js"></script>
<script src="./js/register.js"></script>
</body>
</html>
