<!DOCTYPE html>
<html lang="ko">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>인기 지역 전체보기 · 어디갈까?</title>
  <meta name="description" content="시/군/구별 주간 방문자 수 기준 인기 지역 전체 순위" />
  <link rel="preconnect" href="https://cdn.jsdelivr.net" />
  <link rel="stylesheet" href="https://cdn.jsdelivr.net/gh/orioncactus/pretendard@v1.3.9/dist/web/variable/pretendardvariable.min.css" />
  <link rel="stylesheet" href="css/reset.css" />
  <link rel="stylesheet" href="css/style.css" />
  <link rel="stylesheet" href="css/popArea.css" />
</head>
<body>

  <!-- ===== SVG 아이콘 스프라이트 (index.html에서 이 페이지에 필요한 것만) ===== -->
  <svg class="sprite" aria-hidden="true" focusable="false">
    <symbol id="i-home" viewBox="0 0 24 24"><path d="M3 9.7 12 3l9 6.7V20a1 1 0 0 1-1 1h-5v-6H9v6H4a1 1 0 0 1-1-1V9.7Z"/></symbol>
    <symbol id="i-sparkles" viewBox="0 0 24 24">
      <path d="m11.5 3 1.7 4.3 4.3 1.7-4.3 1.7L11.5 15 9.8 10.7 5.5 9l4.3-1.7L11.5 3Z"/>
      <path d="m18.5 14.5.9 2.1 2.1.9-2.1.9-.9 2.1-.9-2.1-2.1-.9 2.1-.9.9-2.1Z"/>
    </symbol>
    <symbol id="i-notebook" viewBox="0 0 24 24">
      <rect x="5" y="3" width="14" height="18" rx="2"/>
      <path d="M9 3v18M12.5 8h4M12.5 12h4M12.5 16h2.5"/>
    </symbol>
    <symbol id="i-user" viewBox="0 0 24 24"><circle cx="12" cy="8" r="3.6"/><path d="M4.8 20.2a7.2 7.2 0 0 1 14.4 0"/></symbol>
    <symbol id="i-bookmark" viewBox="0 0 24 24"><path d="M6.5 3.5h11a1 1 0 0 1 1 1v16.2l-6.5-4-6.5 4V4.5a1 1 0 0 1 1-1Z"/></symbol>
    <symbol id="i-chevron-right" viewBox="0 0 24 24"><path d="m9.5 5.5 6.5 6.5-6.5 6.5"/></symbol>
    <symbol id="i-chevron-left" viewBox="0 0 24 24"><path d="M14.5 5.5 8 12l6.5 6.5"/></symbol>
  </svg>

  <!-- ===== 헤더 (index.html과 동일) ===== -->
  <header class="header">
    <div class="header__inner">
      <a class="logo" href="index.html">
        <img class="logo__mark" src="images/ui-logo.png" alt="" />
        <span class="logo__text">
          <strong class="logo__title">어디갈까?</strong>
          <span class="logo__sub">국내여행 랜덤 추천 서비스</span>
        </span>
      </a>

      <nav class="gnb" aria-label="주 메뉴">
        <ul class="gnb__list">
          <li><a class="gnb__item is-active" href="index.html"><svg class="ico"><use href="#i-home"/></svg>여행 지도</a></li>
          <li><a class="gnb__item" href="#"><svg class="ico"><use href="#i-sparkles"/></svg>여행 추천</a></li>
          <li><a class="gnb__item" href="#"><svg class="ico"><use href="#i-notebook"/></svg>여행 수첩</a></li>
          <li><a class="gnb__item" href="#"><svg class="ico"><use href="#i-user"/></svg>마이페이지</a></li>
        </ul>
      </nav>

      <div class="header__actions">
        <button class="icon-btn" type="button" id="btnSaved" aria-label="찜한 여행지">
          <svg class="ico"><use href="#i-bookmark"/></svg>
          <span class="icon-btn__badge" id="savedCount" hidden>0</span>
        </button>
        <button class="btn btn--primary btn--login" type="button">로그인</button>
      </div>
    </div>
  </header>

  <!-- ===== 본문 ===== -->
  <main class="popArea">
    <div class="popArea__inner">
      <div class="popArea__head">
        <h1 class="popArea__title">인기 지역 <span class="emoji">✦</span></h1>
        <a class="block__more block__more--static" href="index.html">
          <svg class="ico ico--chevron"><use href="#i-chevron-left"/></svg> 메인으로
        </a>
      </div>

      <!-- 랭킹 기준 탭 -->
      <nav class="popArea-tabs" id="popAreaTabs" aria-label="인기 지역 랭킹 기준">
        <button type="button" class="popArea-tab is-active" data-scope="all">전체</button>
        <button type="button" class="popArea-tab" data-scope="sido">광역자치단체</button>
        <button type="button" class="popArea-tab" data-scope="domestic">내국인(현지인+외지인)</button>
        <button type="button" class="popArea-tab" data-scope="foreign">외국인</button>
      </nav>

      <!-- 광역자치단체 탭 선택 시 나오는 시/도 아코디언 -->
      <div class="popArea-accordion" id="popAreaAccordion" hidden>
        <ul class="filter-row popArea-accordion__row" id="popAreaSidoRow1"></ul>
        <ul class="filter-row popArea-accordion__row" id="popAreaSidoRow2"></ul>
      </div>

      <!-- 인기 지역 랭킹 리스트 -->
      <ul class="popular popular--page" id="popAreaList"></ul>

      <!-- 페이지네이션 (30개 초과 시) -->
      <nav class="popArea-pagination" id="popAreaPagination" aria-label="페이지 이동"></nav>
    </div>
  </main>

  <script src="js/config.js"></script>
  <script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script>
  <script src="js/supabaseClient.js"></script>
  <script src="js/apiCache.js"></script>
  <script type="module" src="js/popArea.js"></script>
</body>
</html>
